# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "samhain-pos"

[setup]
script = '''
Set-Location $env:CODEX_WORKTREE_PATH

$nodeMajor = [int]((node --version).TrimStart("v").Split(".")[0])

if ($nodeMajor -lt 22) {
    throw "Samhain POS nécessite Node.js 22 ou supérieur."
}

corepack enable

pnpm install --frozen-lockfile'''

[setup.win32]
script = '''
Set-Location $env:CODEX_WORKTREE_PATH

$nodeMajor = [int]((node --version).TrimStart("v").Split(".")[0])

if ($nodeMajor -lt 22) {
    throw "Samhain POS nécessite Node.js 22 ou supérieur."
}

corepack enable

pnpm install --frozen-lockfile'''

[cleanup]
script = ""

[cleanup.win32]
script = '''
Set-Location $env:CODEX_WORKTREE_PATH

Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force coverage -ErrorAction SilentlyContinue
Remove-Item -Recurse -Force .vite -ErrorAction SilentlyContinue'''

[[actions]]
name = "Démarrer Samhain POS"
icon = "tool"
command = "pnpm dev"
platform = "win32"

[[actions]]
name = "Tests"
icon = "tool"
command = "pnpm test:run"
platform = "win32"

[[actions]]
name = "Build Android Test"
icon = "tool"
command = "pnpm build:android:test"

[[actions]]
name = "Sync Android Test"
icon = "tool"
command = "pnpm android:sync:test"

[[actions]]
name = "Ouvrir Android Studio"
icon = "tool"
command = "pnpm android:open"
