name: samhain-dashboard
services:
  dashboard:
    image: samhain-dashboard:local
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: ${DASHBOARD_ENV_FILE:?Set the absolute path to dashboard.env}
        required: true
    environment:
      DASHBOARD_PUBLIC: 'true'
      DASHBOARD_PUBLIC_ORIGIN: https://dashboard.samhain.arthurdubos.fr
      DASHBOARD_PORT: '4310'
      NODE_EXTRA_CA_CERTS: /run/certificates/mongo-ca.crt
    volumes:
      - type: bind
        source: /opt/samhain-deploy/certificates/mongo-ca.crt
        target: /run/certificates/mongo-ca.crt
        read_only: true
        bind:
          create_host_path: false
    networks:
      database: {}
      proxy:
        aliases:
          - samhain-dashboard
    # Reachable only from Docker networks; HTTPS is terminated by the existing Caddy.
    expose:
      - '4310'
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
networks:
  database:
    external: true
    name: samhain_database
  proxy:
    external: true
    name: lcdd_proxy
