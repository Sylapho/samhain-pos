apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'

def releaseSigningValue = { String name ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrNull()
}
def releaseStoreFilePath = releaseSigningValue('SAMHAIN_RELEASE_STORE_FILE')
def releaseStorePassword = releaseSigningValue('SAMHAIN_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('SAMHAIN_RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('SAMHAIN_RELEASE_KEY_PASSWORD')
def missingReleaseSigningValues = [
    SAMHAIN_RELEASE_STORE_FILE: releaseStoreFilePath,
    SAMHAIN_RELEASE_STORE_PASSWORD: releaseStorePassword,
    SAMHAIN_RELEASE_KEY_ALIAS: releaseKeyAlias,
    SAMHAIN_RELEASE_KEY_PASSWORD: releaseKeyPassword,
].findAll { entry -> entry.value == null || entry.value.trim().isEmpty() }.keySet()

android {
    namespace = "fr.samhain.pos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.samhain.pos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    signingConfigs {
        release {
            if (releaseStoreFilePath) storeFile rootProject.file(releaseStoreFilePath)
            if (releaseStorePassword) storePassword releaseStorePassword
            if (releaseKeyAlias) keyAlias releaseKeyAlias
            if (releaseKeyPassword) keyPassword releaseKeyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    group = 'verification'
    description = 'Vérifie la présence du keystore et des credentials requis pour une release Samhain.'

    doLast {
        if (!missingReleaseSigningValues.isEmpty()) {
            throw new GradleException(
                "Signature release absente. Renseignez : ${missingReleaseSigningValues.join(', ')}. " +
                'Aucun fallback vers la clé debug n’est autorisé.'
            )
        }

        def configuredStoreFile = rootProject.file(releaseStoreFilePath)
        if (!configuredStoreFile.isFile()) {
            throw new GradleException(
                "Keystore release introuvable : ${configuredStoreFile}. " +
                'Vérifiez SAMHAIN_RELEASE_STORE_FILE.'
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'assembleRelease', 'bundleRelease', 'packageRelease']) {
        task.dependsOn(validateReleaseSigning)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

ksp {
    arg("room.schemaLocation", "${projectDir}/schemas")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation "androidx.room:room-testing:2.8.5"
    ksp "androidx.room:room-compiler:2.8.5"
    implementation "androidx.room:room-runtime:2.8.5"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
